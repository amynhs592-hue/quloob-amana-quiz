
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>اختبري معلوماتك عن التنمر - قلوبنا أمان</title>
<style>
    body {
        font-family: 'Tajawal', Arial, sans-serif;
        background-color: #fff0f5; /* لون وردي فاتح جداً */
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .quiz-container {
        background-color: #ffffff;
        border: 3px solid #ffb6c1; /* إطار وردي */
        border-radius: 20px;
        padding: 30px;
        width: 90%;
        max-width: 600px;
        box-shadow: 0 8px 16px rgba(255, 182, 193, 0.4);
        text-align: center;
    }
    h1 {
        color: #d14781;
        font-size: 24px;
        margin-bottom: 20px;
    }
    .question {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 20px;
        color: #4a4a4a;
    }
    .options button {
        background-color: #ffe4e1;
        border: 2px solid #ffb6c1;
        border-radius: 15px;
        padding: 10px 20px;
        margin: 10px;
        width: 80%;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
        font-family: inherit;
    }
    .options button:hover {
        background-color: #ffb6c1;
        color: white;
    }
    .feedback {
        font-size: 18px;
        font-weight: bold;
        margin: 15px 0;
        min-height: 25px;
    }
    .correct { color: #28a745; }
    .incorrect { color: #dc3545; }
    #next-btn {
        background-color: #d14781;
        color: white;
        border: none;
        padding: 10px 25px;
        border-radius: 20px;
        font-size: 16px;
        cursor: pointer;
        display: none; /* مخفي حتى يتم الإجابة */
    }
    #next-btn:hover { background-color: #b03066; }
</style>
</head>
<body>

<div class="quiz-container">
    <h1>🎀 قلوبنا أمان: اختبري معلوماتك عن التنمر 🎀</h1>
    <div id="quiz-area">
        <div class="question" id="question-text">جاري تحميل السؤال...</div>
        <div class="options" id="options-area"></div>
        <div class="feedback" id="feedback-text"></div>
        <button id="next-btn" onclick="nextQuestion()">السؤال التالي 🌸</button>
    </div>
    <div id="result-area" style="display: none;">
        <h2 style="color: #d14781;">انتهى الاختبار!</h2>
        <p id="score-text" style="font-size: 22px; font-weight: bold;"></p>
        <p style="font-size: 18px; color: #555;">أنتِ بطلة رائعة وتعرفين كيف تحمين نفسك وصديقاتك. تذكري دائماً أن الموجهة الطلابية هنا لمساعدتك!</p>
    </div>
</div>

<script>
    const questions = [
        {
            question: "ما هو التنمر؟",
            options: ["اللعب والمزاح بلطف مع الصديقات.", "إيذاء شخص آخر بالكلمات أو الأفعال بشكل متكرر ومتعمد.", "مساعدة الآخرين في حل واجباتهم."],
            answer: 1
        },
        // يمكنك إضافة بقية الأسئلة التسعة هنا بنفس النمط
        {
            question: "إذا قام شخص ما بمضايقتكِ، ماذا يجب أن تفعلي فوراً؟",
            options: ["أبكي وأبقى صامتة.", "أتشاجر معه وأضربه.", "أبتعد عنه فوراً وأخبر شخصاً بالغاً أثق به."],
            answer: 2
        }
    ];

    let currentQuestion = 0;
    let score = 0;

    const questionText = document.getElementById("question-text");
    const optionsArea = document.getElementById("options-area");
    const feedbackText = document.getElementById("feedback-text");
    const nextBtn = document.getElementById("next-btn");
    const quizArea = document.getElementById("quiz-area");
    const resultArea = document.getElementById("result-area");
    const scoreText = document.getElementById("score-text");

    function loadQuestion() {
        feedbackText.innerHTML = "";
        nextBtn.style.display = "none";
        optionsArea.innerHTML = "";
        
        let q = questions[currentQuestion];
        questionText.innerHTML = q.question;

        q.options.forEach((opt, index) => {
            let btn = document.createElement("button");
            btn.innerHTML = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsArea.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, btn) {
        let q = questions[currentQuestion];
        let buttons = optionsArea.querySelectorAll("button");
        
        // تعطيل الأزرار بعد الإجابة
        buttons.forEach(b => b.disabled = true);

        if(selectedIndex === q.answer) {
            feedbackText.innerHTML = "أحسنتِ، إجابة رائعة! 🌟";
            feedbackText.className = "feedback correct";
            btn.style.backgroundColor = "#c3e6cb";
            score++;
        } else {
            feedbackText.innerHTML = "حاولي مرة أخرى يابطلة! 💪";
            feedbackText.className = "feedback incorrect";
            btn.style.backgroundColor = "#f5c6cb";
            buttons[q.answer].style.backgroundColor = "#c3e6cb"; // إظهار الإجابة الصحيحة
        }
        nextBtn.style.display = "inline-block";
    }

    function nextQuestion() {
        currentQuestion++;
        if(currentQuestion < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        quizArea.style.display = "none";
        resultArea.style.display = "block";
        scoreText.innerHTML = "لقد حصلتِ على " + score + " من " + questions.length + " نقطة!";
    }

    // بدء الاختبار
    loadQuestion();
</script>

</body>
</html>
